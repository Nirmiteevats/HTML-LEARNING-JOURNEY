<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links, Images, Audio & Video</title>
</head>

<body>
    <h1>Links, Images and Media</h1>
    <h2>Anchor Element</h2>
    <h4>basic link</h4>
    <a href="https://www.google.com/">
        Open Google
    </a>
    <br>
    <h4>Open Link in New Tab</h4>
    <a href="https://www.flipkart.com/" target="_blank">
        Open Flipkart
    </a>
    <br><br>

    <hr>
    <h2>Image Element</h2>
    <img src="https://images.unsplash.com/photo-1516321318423-f06f85e504b3" alt="Laptop on a desk" height="200" width="300">

    <br><br>

    <!-- Local Image -->
    <img src="image.png" alt="My Image" width="300">

    <br><br>

    <hr>
    <h2>Image as a Link (Click on image to open link)</h2>
    <a href="https://www.github.com/" target="_blank">
        <img src="https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png" alt="GitHub" width="100">
    </a>

    <hr>
    <h2>Audio</h2>
    <audio controls>
        <source src="myaudio.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <hr>
    <h2>Video</h2>
    <video width="500" controls src="https://www.pexels.com/download/video/37275838/" autoplay loop muted></video>


</body>
</html>
