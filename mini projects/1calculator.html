<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
</head>

<body>

    <h1>Calculator</h1>

    <!-- Calculator Display -->
    <input
        type="text"
        value="0"
        readonly
    ><!--We use readonly in the calculator 
    because the display should show the result, 
    not allow the user to type into it.-->>

    <br><br>

    <!-- Calculator Buttons -->

    <button>AC</button>
    <button>DEL</button>
    <button>%</button>
    <button>/</button>

    <br><br>

    <button>7</button>
    <button>8</button>
    <button>9</button>
    <button>*</button>

    <br><br>

    <button>4</button>
    <button>5</button>
    <button>6</button>
    <button>-</button>

    <br><br>

    <button>1</button>
    <button>2</button>
    <button>3</button>
    <button>+</button>

    <br><br>

    <button>00</button>
    <button>0</button>
    <button>.</button>
    <button>=</button>

</body>

</html>
