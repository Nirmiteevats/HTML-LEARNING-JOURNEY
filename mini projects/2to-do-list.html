<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
</head>

<body>

    <h1>My To-Do List</h1>

    <!-- Add New Task -->
    <h2>Add a Task</h2>

    <form>

        <input
            type="text"
            placeholder="Enter a task"
        >

        <button type="submit">
            Add Task
        </button>

    </form>

    <hr>

    <!-- Pending Tasks -->
    <h2>My Tasks</h2>

    <ul>

        <li>
            <input type="checkbox">
            Complete HTML practice
        </li>

        <li>
            <input type="checkbox">
            Practice DAA
        </li>

        <li>
            <input type="checkbox">
            Study DBMS
        </li>

        <li>
            <input type="checkbox">
            Work on GitHub project
        </li>

    </ul>

    <hr>

    <!-- Completed Tasks -->
    <h2>Completed Tasks</h2>

    <ul>

        <li>
            <input type="checkbox" checked>
            Learn HTML basics
        </li>

        <li>
            <input type="checkbox" checked>
            Create GitHub repository
        </li>

    </ul>

</body>

</html>
