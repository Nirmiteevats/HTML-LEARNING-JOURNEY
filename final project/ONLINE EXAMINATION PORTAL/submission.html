<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Answer Submission</title>

</head>

<body>

    <header>

        <h1>📤 Answer Submission</h1>

    </header>

    <hr>

    <main>

        <section>

            <h2>Review Your Submission</h2>

            <p>
                You have completed the examination.
                Please review the declaration below before
                submitting your answers.
            </p>

        </section>

        <hr>

        <section>

            <h2>📋 Submission Declaration</h2>

            <form action="result.html">

                <input
                    type="checkbox"
                    id="confirm"
                    name="confirm"
                    required
                >

                <label for="confirm">

                    I confirm that I have attempted the
                    examination honestly and that the answers
                    submitted are my own.

                </label>

                <br><br>

                <input
                    type="checkbox"
                    id="final"
                    name="final"
                    required
                >

                <label for="final">

                    I understand that after final submission,
                    I cannot change my answers.

                </label>

                <br><br>

                <button type="submit">
                    Final Submit →
                </button>

            </form>

        </section>

    </main>

    <hr>

    <footer>

        <p>
            &copy; 2026 Online Examination Portal
        </p>

    </footer>

</body>

</html>
